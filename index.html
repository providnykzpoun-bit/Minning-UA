<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UA Mining</title>
    <!-- Підключаємо TonConnect UI CDN -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        /* Твої стилі інтерфейсу (темна темізація, кнопки тощо) */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
        }
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            background: #ffd700;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
        }
        /* Контейнер для кнопки TonConnect */
        #ton-connect-button {
            cursor: pointer;
        }
        .assets-card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        .balance {
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
            margin: 10px 0;
        }
        .claim-btn {
            background-color: #ffd700;
            color: #000;
            border: none;
            padding: 15px;
            width: 90%;
            max-width: 400px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
        }
        /* Сповіщення (як на скріншоті) */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #242424;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            z-index: 1000;
            width: 80%;
            max-width: 300px;
        }
        .modal button {
            background: #2f8af5;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            margin-top: 15px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">
            <div class="avatar">UA</div>
            <div>
                <div style="font-size: 14px; font-weight: bold;">ГАНС 🐝 Гайде...</div>
                <div style="font-size: 11px; color: #888;">Lvl 22</div>
            </div>
        </div>
        <!-- Сюди TonConnect автоматично вбудує свою кнопку підключення -->
        <div id="ton-connect-button"></div>
    </div>

    <div class="assets-card">
        <div style="font-size: 12px; color: #888; text-transform: uppercase;">Assets</div>
        <div class="balance" id="balance-amount">171.1932 UA</div>
        <div style="font-size: 12px; color: #00ff88;">Speed: +0.0001/s</div>
    </div>

    <button class="claim-btn" onclick="claimTokens()">CLAIM</button>

    <!-- Сповіщення про підключення гаманця -->
    <div id="notification-modal" class="modal">
        <div id="modal-text" style="font-size: 16px; font-weight: 500;">Гаманець успішно підключено!</div>
        <button onclick="closeModal()">Закрити</button>
    </div>

    <script>
        // Ініціалізація TonConnect UI
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://leslav2007.github.io/ua-mining/tonconnect-manifest.json', // Твоє посилання на маніфест
            buttonRootId: 'ton-connect-button'
        });

        // Слухаємо зміну стану гаманця
        tonConnectUI.onStatusChange(wallet => {
            if (wallet) {
                // Показуємо модальне вікно успішного підключення
                document.getElementById('notification-modal').style.display = 'block';
                console.log('Wallet connected:', wallet.account.address);
            } else {
                console.log('Wallet disconnected');
            }
        });

        function closeModal() {
            document.getElementById('notification-modal').style.display = 'none';
        }

        // Імітація майнінгу для балансу
        let currentBalance = 171.1932;
        setInterval(() => {
            currentBalance += 0.0001;
            document.getElementById('balance-amount').innerText = currentBalance.toFixed(4) + ' UA';
        }, 1000);

        function claimTokens() {
            alert('Успішно зібрано!');
        }
    </script>
</body>
</html>
